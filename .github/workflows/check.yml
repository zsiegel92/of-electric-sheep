name: Check
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
          cache: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: make install
      - run: make check
      - run: git diff --exit-code -- web/src/generated && test -z "$(git ls-files --others --exclude-standard web/src/generated)"
      - run: make build
